<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clio Sync</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="extension-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <svg class="header-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="header-g" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4f46e5" />
                            <stop offset="100%" stop-color="#6366f1" />
                        </linearGradient>
                    </defs>
                    <path class="header-fnl" d="M12 2C10.5 2 9 3.5 8 5L12 12L16 5C15 3.5 13.5 2 12 2Z" fill="url(#header-g)"/>
                    <path class="header-fnl" d="M12 22C10.5 22 9 20.5 8 19L12 12L16 19C15 20.5 13.5 22 12 22Z" fill="url(#header-g)"/>
                </svg>
                <div class="title-group">
                    <h1>Clio Sync</h1>
                    <span class="logo-pulse-wrapper">
                        <span class="logo-pulse" id="status-dot-pulse"></span>
                    </span>
                </div>
            </div>
            <span class="badge">v1.0.0</span>
        </div>

        <!-- Main Card -->
        <div class="main-card">
            <!-- Connection Status -->
            <div class="info-block">
                <div class="icon-wrapper border-ehr">
                    <svg class="block-icon text-ehr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5" />
                    </svg>
                </div>
                <div class="content-wrapper">
                    <span class="block-label">EHR Portal</span>
                    <div class="status-pill-box">
                        <span class="status-dot" id="status-dot"></span>
                        <span id="status-text" class="status-text">Checking session...</span>
                    </div>
                </div>
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Account Status -->
            <div class="info-block" id="account-box">
                <div class="icon-wrapper border-clio">
                    <svg class="block-icon text-clio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="content-wrapper">
                    <span class="block-label">Clio Notes Account</span>
                    <span class="account-email" id="account-email">Checking local session...</span>
                </div>
            </div>

            <!-- Action Button -->
            <div class="actions-box">
                <button id="sync-btn" class="primary-btn" disabled>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3-3 3 3m-3-3v12" />
                    </svg>
                    <span id="sync-btn-text">Sync Active Session</span>
                </button>
            </div>
            
            <div id="feedback-message" class="feedback hidden"></div>
        </div>

        <!-- Footer -->
        <div class="footer hidden">
            <button id="toggle-settings-btn" class="text-btn">
                <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>Configuración</span>
            </button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel hidden" id="settings-panel">
            <h3>Configuración de Servidor</h3>
            <div class="input-group">
                <label for="settings-supabase-url">Supabase URL</label>
                <input type="text" id="settings-supabase-url" />
            </div>
            <div class="input-group">
                <label for="settings-supabase-key">Supabase Anon Key</label>
                <input type="password" id="settings-supabase-key" />
            </div>
            <div class="input-group">
                <label for="settings-ehr-domain">Dominio EHR</label>
                <input type="text" id="settings-ehr-domain" value="amexzone.com" />
            </div>
            <button id="save-settings-btn" class="secondary-btn">Guardar y Aplicar</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
